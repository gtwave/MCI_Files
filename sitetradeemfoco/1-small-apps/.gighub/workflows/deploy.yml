name: Deploy Trade em Foco via FTP na Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v3

      - name: Configurar Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependências
        run: npm install

      - name: Build do projeto
        run: npm run build

      - name: Mostrar arquivos gerados
        run: ls -al dist/

      - name: Deploy FTP para Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.ftp://147.93.14.54 }}
          port: 21
          username: ${{ secrets.u976833709.tradeemfoco.com.br }}
          password: ${{ secrets.389773Ju! }}
          local-dir: dist/
          server-dir: /
          dangerous-clean-slate: true
          dry-run: false
          log-level: verbose
