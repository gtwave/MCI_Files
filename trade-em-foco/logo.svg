<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rectangle -->
  <rect x="0" y="0" width="200" height="60" fill="none"/>
  
  <!-- Trade em Foco text -->
  <text x="10" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#logoGradient)">TRADE EM</text>
  <text x="10" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#logoGradient)">FOCO</text>
  
  <!-- Decorative square -->
  <rect x="150" y="15" width="30" height="30" fill="none" stroke="url(#logoGradient)" stroke-width="3" rx="3"/>
  <rect x="155" y="20" width="20" height="20" fill="url(#logoGradient)" rx="2"/>
</svg>

